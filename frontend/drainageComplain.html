<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaint for Drainage</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./css/drainageComplain.css">
</head>

<body>

    <div class="container">

        <h1>Complaint for Drainage</h1>

        <div id="msg" class="message"></div>

        <form id="pftForm" enctype="multipart/form-data">

            <!-- Complaint Category -->
            <div class="form-group">
                <label for="category">Complaint Category:</label>

                <input
                    type="text"
                    value="DRAINAGE"
                    readonly
                >

                <input
                    type="hidden"
                    id="category"
                    name="category"
                    value="DRAINAGE"
                >
            </div>

            <!-- Voice Language -->
            <div class="form-group">
                <label for="voiceLang">🎤 Voice Language:</label>

                <select id="voiceLang">
                    <option value="en-IN">English</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="bn-IN">Bengali</option>
                </select>
            </div>

            <!-- Subject -->
            <div class="form-group">
                <label for="subject">Subject:</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter complaint subject"
                    required
                >

                <span
                    class="mic-icon"
                    onclick="startVoiceInput('subject')"
                    title="Speak subject"
                >🎤</span>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description:</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe your drainage problem"
                    required
                ></textarea>

                <span
                    class="mic-icon"
                    onclick="startVoiceInput('description')"
                    title="Speak description"
                >🎤</span>
            </div>

            <!-- Mobile Number -->
            <div class="form-group">
                <label for="mobile">Mobile Number:</label>

                <div style="display: flex; gap: 10px;">
                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                    <button type="button" onclick="getOtp()">
                        Get OTP
                    </button>
                </div>
            </div>

            <!-- OTP Verification -->
            <div
                class="form-group"
                id="otpGroup"
                style="display: none;"
            >
                <label for="otp">Enter OTP:</label>

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter demo OTP"
                    maxlength="6"
                    inputmode="numeric"
                >

                <button type="button" onclick="verifyOtp()">
                    Verify OTP
                </button>
            </div>

            <!-- Location -->
            <div class="form-group">
                <label for="location">Location:</label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Fetching your location..."
                    readonly
                    required
                >

                <button type="button" onclick="getLocation()">
                    Get Location
                </button>
            </div>

            <!-- Photo or Video -->
            <div class="form-group">
                <label for="media">Upload Photo/Video:</label>

                <input
                    type="file"
                    id="media"
                    name="media"
                    accept="image/*,video/*"
                >

                <div id="preview" class="preview"></div>
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="submit-btn"
                disabled
            >
                Submit Complaint
            </button>

        </form>
    </div>

    <script src="./js/drainageComplain.js"></script>

</body>
</html>
