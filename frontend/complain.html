<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locality Complaint Portal</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/complain.css" />
  </head>
  <body>
    <h1>Report a Locality Complaint Issue</h1>

    <div class="cards">

      <div class="card" onclick="goToWaterComplain()">
        <img
          src="https://thumbs.dreamstime.com/b/metal-water-tap-flowing-water-stream-outdoor-setting-water-access-conservation-concepts-metal-water-tap-378867672.jpg"
          alt="Water Problem"
        />
        <h3>Water Supply Problem</h3>
      </div>

      <div class="card" onclick="goToDrainageComplain()">
        <img
          src="https://media.istockphoto.com/id/950679732/photo/discharge-of-sewage-into-a-river.jpg?s=612x612&w=0&k=20&c=yzqTSybAHXdk4q3Z4trus97VjAmx0L8TZ9F95CscSO0="
          alt="Drain"
        />
        <h3>Drainage Issue</h3>
      </div>

      <div class="card" onclick="goToTreefallComplain()">
        <img
          src="https://media.istockphoto.com/id/648108652/photo/large-tree-fallen-across-road.jpg?s=612x612&w=0&k=20&c=KfksoWu5HAeUDPCC3jvjWqkphAbWb7q2JKKS4nzm4Uk="
          alt="Tree Fall"
        />
        <h3>Tree Fall</h3>
      </div>

      <div class="card" onclick="goToPotholesComplain()">
        <img
          src="https://arjasrikanth.in/wp-content/uploads/2024/09/potholes2.jpg?w=1024"
          alt="Potholes"
        />
        <h3>Potholes</h3>
      </div>

      <div class="card" onclick="goToStreetlightComplain()">
        <img
          src="https://www.shutterstock.com/image-photo/old-dilapidated-street-lamp-among-600nw-2457055641.jpg"
          alt="Streetlight"
        />
        <h3>Streetlight</h3>
      </div>

      <div class="card" onclick="goToOverFlowTrashBinsComplain()">
        <img
          src="https://media.istockphoto.com/id/1175874693/photo/huge-garbage-piles-next-to-the-dumpster-after-city-fair-stacks-of-litter-bags-overflow-trash.jpg?s=612x612&w=0&k=20&c=91x9gxN_tT2gdSH0OQMO1q19KTFdhj56B62-dLY8tso="
          alt="Trash Bin"
        />
        <h3>Overflow Trash Bin</h3>
      </div>
      
    </div>

    <!-- Back to Home Button -->

    <button class="back-btn" onclick="goHome()">⬅ Back to Home</button>
    <script src="./js/complain.js"></script>
  </body>
</html>
